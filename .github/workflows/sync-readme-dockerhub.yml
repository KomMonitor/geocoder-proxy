name: Sync README to Docker Hub

on:
  push:
    branches: [ master ]
    paths:
      - README_DOCKERHUB.md
      - .github/workflows/sync-readme-dockerhub.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_DANO_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DANO_SECRET }}
          repository: kommonitor/geocoder-proxy
          readme-filepath: ./README_DOCKERHUB.md
